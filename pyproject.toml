[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gather-gpu"
version = "0.1.0"
description = "A small private GPU compute pool"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "psutil>=6"]

[project.scripts]
gather = "gather.cli:main"
gather-worker = "gather.worker:main"

[tool.setuptools.packages.find]
include = ["gather*"]
